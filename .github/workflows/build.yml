name: Build Geode Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.9.0
          target: iOS
